<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вход в систему управления продажами</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --accent: #2563eb;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .auth-card {
      background: var(--card);
      width: min(400px, 100%);
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.08);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      background: #fff;
    }
    input:focus {
      border-color: var(--accent);
    }
    .field { margin-bottom: 16px; }
    .btn {
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .extra {
      display: flex;
      justify-content: flex-start;
      margin-top: 10px;
      font-size: 13px;
      gap: 12px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="title">Вход в систему</div>
    <div class="subtitle">CRM для отдела продаж</div>

    <form action="dashboard.html" method="get">
      <div class="field">
        <label for="email">E-mail или логин</label>
        <input id="email" name="email" type="text" placeholder="manager@company.ru" required />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn" type="submit">Войти</button>

      <div class="extra">
        <a href="#">Забыли пароль?</a>
      </div>
    </form>
  </main>
</body>
</html>
